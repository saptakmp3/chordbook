function ui(){const sy=window.scrollY,A=ed.acc,wh=[0,2,4,5,7,9,11],bl=[[1,0],[3,1],[6,3],[8,4],[10,5]],tieSel=sel>=0&&ed.c[sel]&&ed.c[sel].tie;
const key=(p,cls,i)=>`<button class="${cls}${(bassMode?dr.b:dr.r)==p?' on':''}" ${i!=null?`style="left:${(i+1)*100/7}%"`:''} onclick="pickRoot(${p})">${cls=='b'?N.s[p]+'<br>'+N.f[p]:N[A][p]}</button>`;
$('#app').innerHTML=`<div class="top"><button class="ib" onclick="commit();stop();home()">‹</button><div class="row" style="margin:0"><button class="sm ${A=='f'?'on':''}" onclick="ed.acc='f';ui()">♭</button><button class="sm ${A=='s'?'on':''}" onclick="ed.acc='s';ui()">♯</button><button class="ib" onclick="ed.fav=!ed.fav;ui()">${ed.fav?'★':'☆'}</button><button class="ib" onclick="openSheet()">⚙</button></div></div>
<input type="text" class="title" id="tt" placeholder="Title" value="${esc(ed.t)}">
<div class="cards">${ed.c.map((c,i)=>{const d=c.d||4;return `<button class="cc${i==sel?' sel':''}${c.tie?' tie':''}" data-i="${i}" onclick="selc(${i})">${cn(c,A)}<small>${!c.tie&&c.inv?INVN[Math.min(c.inv,6)]+' inv · ':''}${d} beat${d>1?'s':''}</small></button>`}).join('')||'<div class="pv">Tap a root and a quality, then Add.</div>'}</div>
<div class="row er">${sel>=0?`<span class="sub" style="color:var(--acc)">Editing ${sel+1}</span>`:''}${bsel()}<button class="sm" onclick="addTie()">＋ TIE</button>${sel>=0?`<button class="sm" onclick="mv(-1)">◀</button><button class="sm" onclick="mv(1)">▶</button><button class="sm" onclick="startPlay(ed,()=>loopOn,sel)">Play from here</button><button class="sm" onclick="dup()">Copy</button><button class="sm red" onclick="del()">Delete</button><button class="sm" onclick="sel=-1;ui()">Done</button>`:''}</div>
<div class="cols"><div class="cA">
<div class="read"><div class="rn">${nm(dr,A)}</div><div class="rl">${bassMode?'Pick bass note':tieSel?'Tie selected':(dr.inv?INVN[Math.min(dr.inv,6)]+' inversion · ':'')+(sel>=0?'Editing chord '+(sel+1):'New chord')}</div></div>
<div class="lbl">${bassMode?'Bass note':'1 · Root'}</div>
<div class="kb">${wh.map(p=>key(p,'w')).join('')}${bl.map(([p,i])=>key(p,'b',i)).join('')}</div>
<div class="lbl">2 · Quality</div><div class="wrap">${BQ.map(k=>`<button class="q${dr.q==k?' on':''}" onclick="pickQ('${k}')">${qlab(k)}</button>`).join('')}</div>
<div class="lbl">3 · Extension</div><div class="wrap">${EXT.map(x=>`<button class="q${dr.e==x?' on':''}${SEV.includes(dr.q)||dr.q===''||dr.q=='m'?'':' off'}" onclick="pickE(${x})">${x}</button>`).join('')}</div>
<div class="lbl">4 · Alter</div><div class="wrap">${ALT.map(x=>`<button class="q${dr.a.includes(x)?' on':''}" onclick="pickA('${x}')">${x}</button>`).join('')}</div>
${invHTML(A)}
<div class="lbl">6 · Slash bass</div><div class="row" style="margin-top:0"><button class="sm ${bassMode?'on':''}" onclick="bassMode=!bassMode;ui()">／ Slash bass${dr.b!=null?': '+N[A][dr.b]:''}</button>${dr.b!=null?'<button class="sm" onclick="dr.b=null;bassMode=false;ui()">✕ clear</button>':''}</div>
<div class="sub" style="margin-top:2px">Slash = extra bass note under the whole chord. Inversion = the chord's own notes reordered.</div>
</div><div class="cB">
<div class="lbl">Sound</div><div class="row"><button class="sm on" onclick="openSheet()">♪ <span class="snm">${SND[inst].n}</span> ▾</button>${segHTML()}</div>
<div class="lbl">Volume</div>${volHTML()}
<div class="lbl">Tempo</div>
<div class="row"><button class="sm" onclick="bpm(-1)">−</button><input id="tm" type="range" min="40" max="200" value="${ed.tempo}" oninput="setBpm(+this.value)" onchange="commit()"><button class="sm" onclick="bpm(1)">+</button><span id="bp" class="sub" style="width:64px;justify-content:flex-end">${ed.tempo} bpm</span></div>
<div class="row"><button class="sm lp ${loopOn?'on':''}" onclick="togLoop()">⟲ Loop</button><button class="sm mt ${metOn?'on':''}" onclick="togMet()">🥁 Click</button></div>
<div class="lbl">Transpose</div>
<div class="row"><button class="sm" onclick="tr(-1)">−1</button><button class="sm" onclick="tr(1)">+1</button><button class="sm" onclick="tr(-2)">−2</button><button class="sm" onclick="tr(2)">+2</button><select onchange="this.value!==''&&toKey(+this.value)"><option value="">To key…</option>${N[A].map((n,i)=>`<option value="${i}">${n}</option>`).join('')}</select></div>
${tagsUI()}${recUI()}<div class="lbl">Progression</div><div class="row"><button class="sm" onclick="dupP()">Duplicate</button><button class="sm red" onclick="delP()">Delete</button></div>
</div></div>
<div class="bar"><div><button class="big" onclick="ed.c.length&&(commit(),home())">Save</button><button class="big" onclick="addc()">＋ Add${sel>=0?' new':''}</button><button class="big p" data-play="${ed.id}" data-lbl="1" onclick="play(ed,()=>loopOn)">▶ Play</button></div></div>`;
scrollTo(0,sy);drag();$('#tt').oninput=e=>{ed.t=e.target.value;clearTimeout(ed._t);ed._t=setTimeout(commit,600)};upPlay();playing&&pl&&pl.p===ed&&mark(cur)}
function pickRoot(p){bassMode?dr.b=p:dr.r=p;apply()}
function pickQ(k){dr.q=k;if(!SEV.includes(k))dr.e=0;apply()}
function pickE(x){if(!SEV.includes(dr.q)){if(dr.q==='')dr.q='7';else if(dr.q==='m')dr.q='m7';else return}dr.e=dr.e==x?0:x;apply()}
function pickA(x){const i=dr.a.indexOf(x);if(i>=0)dr.a.splice(i,1);else{const ex={'♭5':'♯5','♯5':'♭5','♭9':'♯9','♯9':'♭9'}[x];if(ex)dr.a=dr.a.filter(y=>y!=ex);dr.a.push(x)}apply()}
function pickInv(i){dr.inv=i;apply()}
function pv(d){stop();chordSound(dr,vo(dr),ctx().currentTime+.03,d,60/(ed.tempo||80))}
function apply(){if(sel>=0&&ed.c[sel]&&ed.c[sel].tie)sel=-1;if((dr.inv||0)>=ivs(dr).length)dr.inv=0;
if(sel>=0){const c=ed.c[sel];c.r=dr.r;c.q=dr.q;c.e=dr.e;c.a=[...dr.a];c.b=dr.b;c.inv=dr.inv||0;commit()}
if(bassMode&&dr.b!=null)bassMode=false;ui();pv(1.5)}
function addc(){pv(1);ed.c.push({...dr,a:[...dr.a],inv:dr.inv||0,d:bts});sel=-1;commit();ui()}
function addTie(){ed.c.push({tie:true,d:bts});sel=-1;commit();ui()}
function setBeats(n){bts=n;if(sel>=0&&ed.c[sel]){ed.c[sel].d=n;commit();ui()}}
function selc(i){if(nc)return;stop();if(sel==i){sel=-1;ui();return}sel=i;const c=ed.c[i];bts=c.d||4;bassMode=false;
if(c.tie){ui();return}dr={...c,a:[...(c.a||[])],inv:c.inv||0};delete dr.d;ui();chordSound(c,vo(c),ctx().currentTime+.03,1.5,60/(ed.tempo||80))}
function mv(d){const j=sel+d;if(j<0||j>=ed.c.length)return;[ed.c[sel],ed.c[j]]=[ed.c[j],ed.c[sel]];sel=j;commit();ui()}
function dup(){ed.c.splice(sel+1,0,{...ed.c[sel]});sel++;commit();ui()}
function del(){ed.c.splice(sel,1);sel=-1;commit();ui()}
function dupP(){commit();const n=JSON.parse(JSON.stringify(ed));n.id=rid();n.t=(n.t||'Untitled')+' copy';n.cr=Date.now();n.fav=false;save(n);edit(n.id)}
function delP(){if(!confirm('Delete this progression? It will also disappear on your other devices.'))return;stop();clearTimeout(ed._t);ed.del=true;save(ed);home()}
function tr(n){ed.c.forEach(c=>{if(c.tie)return;c.r=mod(c.r+n);if(c.b!=null)c.b=mod(c.b+n)});const f=ed.c.find(c=>!c.tie);if(f)ed.acc=FLATKEYS.includes(f.r)?'f':'s';dr={...dr,r:mod(dr.r+n),b:dr.b==null?null:mod(dr.b+n)};sel=-1;commit();ui()}
function toKey(k){const f=ed.c.find(c=>!c.tie);if(isNaN(k)||!f)return;tr(mod(k-f.r))}
const allTags=()=>[...new Set(L.filter(p=>!p.del).flatMap(p=>p.tags||[]))].sort();
function tagsUI(){const ex=allTags().filter(t=>!(ed.tags||[]).includes(t));return `<div class="lbl">Tags</div><div class="wrap">${(ed.tags||[]).map(t=>`<button class="sm on" onclick="rmTag('${t}')">#${esc(t)} ✕</button>`).join('')}${ex.map(t=>`<button class="sm" onclick="addTag('${t}')">+ ${esc(t)}</button>`).join('')}<input type="text" placeholder="new tag ↵" style="width:110px;margin:0;padding:8px 12px;font-size:16px;border-radius:12px" onkeydown="if(event.key=='Enter')addTag(this.value)"></div>`}
function addTag(t){t=t.toLowerCase().replace(/[^a-z0-9 \-]/g,'').trim();if(!t)return;ed.tags=ed.tags||[];if(!ed.tags.includes(t))ed.tags.push(t);commit();ui()}
function rmTag(t){ed.tags=ed.tags.filter(x=>x!=t);commit();ui()}
// uploaded/recorded audio is stored as a data URL; play it through a Blob URL with the mime type sniffed from the bytes (labels from file pickers are often wrong)
const sniff=b=>{const s=String.fromCharCode(...b.slice(0,12));return s.startsWith('ID3')||(b[0]==255&&(b[1]&224)==224)?'audio/mpeg':s.startsWith('RIFF')&&s.slice(8,12)=='WAVE'?'audio/wav':s.startsWith('OggS')?'audio/ogg':s.slice(4,8)=='ftyp'?'audio/mp4':b[0]==26&&b[1]==69?'audio/webm':s.startsWith('fLaC')?'audio/flac':s.startsWith('FORM')?'audio/aiff':''},bu={};
function recURL(id,d){const k=id+':'+d.length;if(bu[k])return bu[k];try{const i=d.indexOf(','),bin=atob(d.slice(i+1)),u=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)u[j]=bin.charCodeAt(j);return bu[k]=URL.createObjectURL(new Blob([u],{type:sniff(u)||d.slice(5,i).split(';')[0]||'audio/mpeg'}))}catch(e){return d}}
function recUI(){return `<div class="lbl">Recording</div><div class="row">${rec?`<button class="sm red" onclick="recStop()">■ Stop · <span id="rtm">0</span>s</button>`:`<button class="sm" onclick="recStart()">🎙 ${ed.rec?'Re-record':'Record'}</button><label class="sm">📁 Add audio file<input type="file" accept="audio/*" hidden onchange="recFile(this.files[0])"></label>`}${ed.rec&&!rec?`<button class="sm red" onclick="ed.rec=null;commit();ui()">Delete</button>`:''}</div>${ed.rec&&!rec?`<audio controls playsinline preload="metadata" src="${recURL(ed.id,ed.rec)}" onerror="$('#re').textContent='This browser cannot play that file. MP3, M4A or WAV work best.'" style="width:100%;margin-top:6px"></audio>`:''}<div class="sub" id="re"></div>`}
async function recStart(){stop();const E=ed;try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false}});
const mt=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
const mr=new MediaRecorder(st,{mimeType:mt,audioBitsPerSecond:32000}),ch=[];mr.ondataavailable=x=>ch.push(x.data);
mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(rec.iv);const fr=new FileReader();fr.onload=()=>{E.rec=fr.result;rec=null;save(E);if(ed===E)ui()};fr.readAsDataURL(new Blob(ch,{type:mt}))};
mr.start();let n=0;rec={mr,iv:setInterval(()=>{n++;const x=$('#rtm');x&&(x.textContent=n);if(n>=40)recStop()},1000)};ui()}catch(x){const e=$('#re');e&&(e.textContent='Mic blocked ('+(x.name||'error')+'). Usually the host page blocks it: serve the file over HTTPS (e.g. GitHub Pages) or use Add audio file.')}}
function recFile(f){if(!f)return;const e=$('#re');if(f.size>1.1e6){e.textContent='File too big (max about 1 MB).';return}const fr=new FileReader();fr.onload=()=>{ed.rec=fr.result;commit();ui()};fr.readAsDataURL(f)}
const recStop=()=>rec&&rec.mr.state!='inactive'&&rec.mr.stop();
function drag(){document.querySelectorAll('.cc').forEach(el=>{el.onpointerdown=e=>{const x=e.clientX,y=e.clientY,tm=setTimeout(()=>{dg=el;nc=1;el.classList.add('lift');el.setPointerCapture(e.pointerId);navigator.vibrate&&navigator.vibrate(8)},220);
el.onpointermove=ev=>{if(!dg){if(Math.hypot(ev.clientX-x,ev.clientY-y)>8)clearTimeout(tm);return}
const t=document.elementFromPoint(ev.clientX,ev.clientY),tc=t&&t.closest&&t.closest('.cc');if(tc&&tc!==dg){const after=dg.compareDocumentPosition(tc)&Node.DOCUMENT_POSITION_FOLLOWING;tc.parentNode.insertBefore(dg,after?tc.nextSibling:tc)}};
el.onpointerup=el.onpointercancel=()=>{clearTimeout(tm);if(!dg)return;const cs=[...document.querySelectorAll('.cc')],old=ed.c,os=sel>=0?old[sel]:null;ed.c=cs.map(c=>old[+c.dataset.i]);if(os)sel=ed.c.indexOf(os);dg=null;commit();setTimeout(()=>{nc=0},60);ui()}}})}

// ---------- updates: new versions propagate through the service worker (see sw.js: network-first for the page)
function showUpd(){if($('#upd'))return;const d=document.createElement('div');d.id='upd';d.className='upd';d.innerHTML='<span>New version ready</span><button class="sm on" onclick="location.reload()">Refresh</button>';document.body.appendChild(d)}
if('serviceWorker' in navigator){let had=!!navigator.serviceWorker.controller;
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had){had=true;return}playing||ed?showUpd():location.reload()});
navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{const chk=()=>reg.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{document.hidden||chk()});setInterval(chk,1800000);chk()}).catch(()=>{})}
home();loadInst(inst);syncNow();
</script></body></html>
